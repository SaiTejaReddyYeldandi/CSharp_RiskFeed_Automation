name: risk-feed-automation

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: riskfeed
      POSTGRES_USER: riskfeed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riskfeed_dev}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskfeed -d riskfeed"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - risk-feed-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__RiskFeedDb: >-
        Host=postgres;Port=5432;Database=riskfeed;Username=riskfeed;Password=${POSTGRES_PASSWORD:-riskfeed_dev}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "${RISK_FEED_PORT:-8088}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  risk-feed-postgres:
